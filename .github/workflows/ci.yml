name: Research release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Standard-library tests (optional research modules skip)
        run: python -S scripts/run_tests.py --json-output tmp/core-tests.json
      - name: Synthetic ingestion demo
        run: make demo PYTHON="python -S"
      - name: Verify published evidence
        run: make verify-results PYTHON="python -S"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-tests-${{ matrix.python }}
          path: tmp/core-tests.json

  partial-dependencies:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"
      - run: python -m pip install numpy==2.5.4 pandas==3.0.6
      - name: Confirm plotting dependency is absent
        run: python -c "import importlib.util; assert importlib.util.find_spec('matplotlib') is None"
      - name: Optional-dependency discovery regression
        run: python scripts/run_tests.py --json-output tmp/partial-tests.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partial-tests
          path: tmp/partial-tests.json

  full-research:
    # Matches the pilot's macOS ARM / Python 3.14 environment; CPU tests only.
    runs-on: macos-14
    env:
      PYTHONPATH: src
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"
          cache: pip
          cache-dependency-path: requirements-ml.lock.txt
      - run: python -m pip install -r requirements-ml.lock.txt
      - name: Full research tests (no skips allowed)
        run: python scripts/run_tests.py --require-no-skips --json-output tmp/full-tests.json
      - name: Verify published evidence
        run: make verify-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-tests
          path: tmp/full-tests.json
